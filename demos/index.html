<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>M2.9 · MDC-Web · 纯直角 & 莫奈动态色 Navigation Rail 全景展厅</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.ico">
  <link rel="shortcut icon" href="/favicon.ico">
  <!-- 本地高可用字体与 Material Icons 官方与本地双重高可用库 -->
  <link rel="stylesheet" href="../icons/material-icons/material-icons.css">
  <link rel="stylesheet" href="/icons/material-icons/material-icons.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="https://unpkg.com/material-design-icons@3.0.1/iconfont/material-icons.css">
  
  <!-- MDC Web 官方组件库样式 (纯直角 0px & 50% 纯圆几何骨架) -->
  <link rel="stylesheet" href="https://unpkg.com/material-components-web@0.34.1/dist/material-components-web.min.css">

  <!-- MDC Web M2.9 全局组件库与展厅样式表 (从 packages/ 统一调用) -->
  <link rel="stylesheet" href="/assets/index.css">
  <link rel="stylesheet" href="/assets/material-components-web.css">
  <link rel="stylesheet" href="../build/material-components-web.css">
  <link rel="stylesheet" href="/demos/index.css">
</head>
<body>
  <!-- 🌟 全局独立底层背景渲染容器 (专供背景水波纹动画) -->
  <div id="app-bg-layer"></div>

  <!-- 左侧 Navigation Rail (桌面端 72px 紧凑 / 260px 悬浮展开) -->
  <div data-include="/demos/src/containers/navigation-rail.html"></div>

  <!-- 移动端独立抽屉导航组件 (Mobile Drawer) -->
  <div data-include="/demos/src/containers/mobile-drawer.html"></div>

  <!-- 中央主内容区 -->
  <main class="main-container" id="mainContainer">
      
    <!-- 模块 0: 主页概览 -->
    <div data-include="/demos/src/content/overview.html" data-span="full" data-pin="top"></div>
    
    <!-- 模块 1: 按钮 -->
    <div data-include="/demos/src/content/buttons.html"></div>
    
    <!-- 模块 2: 卡片 -->
    <div data-include="/demos/src/content/cards.html"></div>
    
    <!-- 模块 3: 标签 -->
    <div data-include="/demos/src/content/chips.html"></div>
    
    <!-- 模块 4: 表单 -->
    <div data-include="/demos/src/content/form.html"></div>
    
    <!-- 模块 5: 列表 -->
    <div data-include="/demos/src/content/list.html"></div>
    
    <!-- 模块 6: 弹窗与菜单 -->
    <div data-include="/demos/src/content/dialogs.html"></div>
    
    <!-- 模块 7: 选项卡 -->
    <div data-include="/demos/src/content/tabs.html"></div>
    
    <!-- 模块 8: 进度条 -->
    <div data-include="/demos/src/content/progress.html"></div>
    
    <!-- 模块 9: Monet 实验室 -->
    <div data-include="/demos/src/content/monet-lab.html"></div>
    
    <!-- 模块 10: 排版与字体 -->
    <div data-include="/demos/src/content/typography.html"></div>
    
    <!-- 模块 11: 选择器入口 (实际功能位于右侧组件栏) -->
    <div data-include="/demos/src/content/pickers.html"></div>
    
    <!-- 模块 12: 页脚 -->
    <div data-include="/demos/src/content/footer.html" data-span="full" data-pin="bottom"></div>
      
  </main>

  <!-- 右侧常驻组件栏 (Component Panel) -->
  <div data-include="/demos/src/containers/component-panel.html"></div>

  <!-- 全局浮层 (Backdrops, FAB, Snackbar) -->
  <div data-include="/demos/src/containers/overlays.html"></div>

  <!-- ========================================================================= -->
  <!-- 核心交互逻辑与动态加载模块 -->
  <!-- ========================================================================= -->
  
  <!-- 官方 MDC Web 核心 JS 引擎 -->
  <script src="https://unpkg.com/material-components-web@0.34.1/dist/material-components-web.min.js"></script>

  <!-- 依赖: Monet 主题引擎 (用于动态 CAM16 色彩生成) -->
  <script src="/assets/monet-mdc.iife.js"></script>
  
  <!-- M2.9 HTML Fragment Loader (负责注入 data-include 片段) -->
  <script src="/demos/src/js/loader.js"></script>

  <!-- M2.9 核心业务逻辑 (原 index.html 交互逻辑提取) -->
  <script src="/demos/src/js/app.js"></script>

</body>
</html>
