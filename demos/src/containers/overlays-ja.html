<!--
  M2.9 Container: グローバルフローティング要素 (Backdrop, FAB, Snackbar - Japanese)
  ═══════════════════════════════════════════════════
-->
<!-- 🧩 コンポーネントパネル用バックドロップ -->
<div id="componentPanelBackdrop" class="component-panel-backdrop" onclick="closeComponentPanel()"></div>

<!-- モバイルドロワー用バックドロップと左下フローティングFAB -->
<div id="mobileDrawerBackdrop" class="mobile-drawer-backdrop" onclick="closeMobileDrawer()"></div>
<button id="btnMobileFloatingMenu" class="mobile-floating-menu-btn mdc-fab" onclick="openMobileDrawer()" title="メニューを開く">
  <i class="material-icons mdc-fab__icon">menu</i>
</button>

<!-- 📱 モバイル用エッジスワイプジェスチャーガイド (Android 10-12 全画面ジェスチャーアニメーション) -->
<div id="m29GestureHintLeft" class="m29-gesture-hint m29-gesture-hint--left" aria-hidden="true" onclick="openMobileDrawer()" title="スワイプしてドロワーを展開">
  <svg viewBox="0 0 24 24"><path d="M 8,4 L 8,12 L 8,20" /></svg>
</div>
<div id="m29GestureHintRight" class="m29-gesture-hint m29-gesture-hint--right" aria-hidden="true" onclick="openComponentPanel()" title="スワイプしてコンポーネントを展開">
  <svg viewBox="0 0 24 24"><path d="M 16,4 L 16,12 L 16,20" /></svg>
</div>

<!-- 軽量 Snackbar 通知 -->
<div id="demoSnackbar" class="m29-demo-toast">
  <span>MDC-Web 完全直角＆モネダイナミックカラーの準備が整いました！</span>
  <button class="mdc-button mdc-button--dense" onclick="hideDemoToast()" style="color: var(--mdc-theme-primary); font-weight: bold; min-width: auto; padding: 0;">了解</button>
</div>
