<!--
  M2.9 Container: 全局浮层 (Backdrop, FAB, Snackbar)
  ═══════════════════════════════════════════════════
  📦 示例调用包:

  1. CSS: .component-panel-backdrop, .mobile-drawer-backdrop,
     .mobile-floating-menu-btn, .m29-demo-toast

  2. JS:
     - closeComponentPanel() — 点击 backdrop 关闭组件栏
     - closeMobileDrawer() — 点击 backdrop 关闭抽屉
     - openMobileDrawer() — 点击 FAB 打开抽屉
     - showDemoToast(msg), hideDemoToast() — Snackbar 控制
-->
<!-- 🧩 组件栏移动端遮罩 -->
<div id="componentPanelBackdrop" class="component-panel-backdrop" onclick="closeComponentPanel()"></div>

<!-- 移动端侧边栏半透明遮罩与左下角悬浮按钮 -->
<div id="mobileDrawerBackdrop" class="mobile-drawer-backdrop" onclick="closeMobileDrawer()"></div>
<button id="btnMobileFloatingMenu" class="mobile-floating-menu-btn mdc-fab" onclick="openMobileDrawer()" title="打开侧边栏菜单">
  <i class="material-icons mdc-fab__icon">menu</i>
</button>

<!-- 📱 移动端边缘滑动引导指示器 (Android 10-12 全面屏手势动画 · 无背景主色描边 + 内部图标 O> / <O) -->
<div id="m29GestureHintLeft" class="m29-gesture-hint m29-gesture-hint--left" aria-hidden="true" onclick="openMobileDrawer()" title="滑动展开侧边栏">
  <i class="material-icons m29-gesture-hint-icon">menu</i>
  <svg viewBox="0 0 32 48"><path d="M 6,10 L 6,24 L 6,38" /></svg>
</div>
<div id="m29GestureHintRight" class="m29-gesture-hint m29-gesture-hint--right" aria-hidden="true" onclick="openComponentPanel()" title="滑动展开组件栏">
  <svg viewBox="0 0 32 48"><path d="M 26,10 L 26,24 L 26,38" /></svg>
  <i class="material-icons m29-gesture-hint-icon">widgets</i>
</div>

<!-- 轻量提示 Snackbar -->
<div id="demoSnackbar" class="m29-demo-toast">
  <span>MDC-Web 纯直角与莫奈动态色彩已就绪！</span>
  <button class="mdc-button mdc-button--dense" onclick="hideDemoToast()" style="color: var(--mdc-theme-primary); font-weight: bold; min-width: auto; padding: 0;">知道了</button>
</div>
