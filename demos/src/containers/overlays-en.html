<!--
  M2.9 Container: Global Overlays (English)
  ═══════════════════════════════════════════════════
  📦 Standard English overlays module for Backdrop, FAB, and Toast.
-->
<!-- Component Panel Backdrop -->
<div id="componentPanelBackdrop" class="component-panel-backdrop" onclick="closeComponentPanel()"></div>

<!-- Mobile Drawer Backdrop & Floating Menu FAB -->
<div id="mobileDrawerBackdrop" class="mobile-drawer-backdrop" onclick="closeMobileDrawer()"></div>
<button id="btnMobileFloatingMenu" class="mobile-floating-menu-btn mdc-fab" onclick="openMobileDrawer()" title="Open Navigation Menu">
  <i class="material-icons mdc-fab__icon">menu</i>
</button>

<!-- 📱 Mobile Edge Gesture Hint (Android 10-12 Edge Gesture Animation · Transparent & Primary Tinted + Inner Icon O> / <O) -->
<div id="m29GestureHintLeft" class="m29-gesture-hint m29-gesture-hint--left" aria-hidden="true" onclick="openMobileDrawer()" title="Swipe to open drawer">
  <i class="material-icons m29-gesture-hint-icon">menu</i>
  <svg viewBox="0 0 32 48"><path d="M 6,10 L 6,24 L 6,38" /></svg>
</div>
<div id="m29GestureHintRight" class="m29-gesture-hint m29-gesture-hint--right" aria-hidden="true" onclick="openComponentPanel()" title="Swipe to open component panel">
  <svg viewBox="0 0 32 48"><path d="M 26,10 L 26,24 L 26,38" /></svg>
  <i class="material-icons m29-gesture-hint-icon">widgets</i>
</div>

<!-- Snackbar Toast Notification -->
<div id="demoSnackbar" class="m29-demo-toast">
  <span>MDC-Web 0px Sharp Geometry & Monet Dynamic Color Ready!</span>
  <button class="mdc-button mdc-button--dense" onclick="hideDemoToast()" style="color: var(--mdc-theme-primary); font-weight: bold; min-width: auto; padding: 0;">DISMISS</button>
</div>
