<!--
  M2.9 Content Card: 进度指示器与轻量提示
  ═══════════════════════════════════════════════════
  📦 示例调用:
    需引入: index.css (.m29-progress, .m29-progress-indeterminate, .m29-progress-determinate)
    JS: setDeterminateProgress(val)
-->
<!-- ⏳ 模块 8: 进度指示器与轻量提示 (Progress Indicators) -->
<div class="demo-card" id="section-progress">
  <h3 style="margin-top: 0; font-size: 16px; font-weight: bold; border-bottom: 1px solid rgba(0,0,0,0.08); padding-bottom: 8px; display: flex; align-items: center;">
    <i class="material-icons" style="font-size: 20px; color: var(--mdc-theme-primary); margin-right: 8px;">hourglass_empty</i>
    8. 进度指示器与轻量提示 (Progress &amp; Snackbar)
  </h3>
  <div style="display: flex; flex-direction: column; gap: 20px; margin-top: 16px;">
    <div>
      <div style="font-size: 12px; font-weight: 600; margin-bottom: 8px;">双波形不确定线性进度条 (Indeterminate Progress from Master):</div>
      <div class="m29-progress">
        <div class="m29-progress-indeterminate"></div>
      </div>
    </div>

    <div>
      <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; margin-bottom: 8px;">
        <span>确定型线性进度条 (Determinate Progress):</span>
        <span id="determinate-val" style="font-family: monospace; color: var(--mdc-theme-primary);">65%</span>
      </div>
      <div class="m29-progress">
        <div class="m29-progress-determinate" id="demoDeterminateBar" style="width: 65%;"></div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 20px; flex-wrap: wrap;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <span style="font-size: 12px; font-weight: 600;">环形指示器:</span>
        <div style="width: 28px; height: 28px; border: 3px solid rgba(0,0,0,0.1); border-top-color: var(--mdc-theme-primary); border-radius: 50% !important; animation: spin 1s linear infinite;"></div>
        <span style="font-size: 12px; opacity: 0.8;">Material 纯圆旋转动画</span>
      </div>

      <div style="display: flex; gap: 8px; margin-left: auto;">
        <button class="mdc-button mdc-button--dense mdc-button--outlined" onclick="setDeterminateProgress(25)">25%</button>
        <button class="mdc-button mdc-button--dense mdc-button--outlined" onclick="setDeterminateProgress(65)">65%</button>
        <button class="mdc-button mdc-button--dense mdc-button--outlined" onclick="setDeterminateProgress(100)">100%</button>
      </div>
    </div>
  </div>
</div>
