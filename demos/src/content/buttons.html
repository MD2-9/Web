<!--
  M2.9 Content Card: 按钮、FAB、分段按钮与图标按钮
  ═══════════════════════════════════════════════════
  📦 示例调用:
    <div class="demo-card" id="section-buttons">...</div>
    需引入: mdc-button.css, mdc-fab.css, mdc-segmented-button.css, mdc-badge.css
-->
<!-- 🔘 模块 1: 按钮、FAB、分段按钮与图标按钮 (Buttons & Actions) -->
<div class="demo-card" id="section-buttons">
  <h3 style="margin-top: 0; font-size: 16px; font-weight: bold; border-bottom: 1px solid rgba(0,0,0,0.08); padding-bottom: 8px; display: flex; align-items: center;">
    <i class="material-icons" style="font-size: 20px; color: var(--mdc-theme-primary); margin-right: 8px;">touch_app</i>
    1. 按钮、浮动动作按钮与分段控制矩阵 (Buttons &amp; Actions)
  </h3>
  
  <!-- 基础常用按钮 (Common Buttons) -->
  <div style="font-size: 12px; font-weight: 600; margin-top: 12px; opacity: 0.85;">基础形态与海拔层级:</div>
  <div style="display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-top: 8px;">
    <button class="mdc-button mdc-button--raised">
      <i class="material-icons mdc-button__icon">star</i>
      Primary Raised
    </button>
    <button class="mdc-button mdc-button--unelevated" style="background-color: var(--mdc-theme-secondary); color: var(--mdc-theme-on-secondary);">
      <i class="material-icons mdc-button__icon">favorite</i>
      Secondary Tonal
    </button>
    <button class="mdc-button mdc-button--outlined">
      <i class="material-icons mdc-button__icon">bookmark</i>
      Outlined
    </button>
    <button class="mdc-button">
      Flat Text
    </button>
    <button class="mdc-button mdc-button--dense mdc-button--raised">
      Dense Button
    </button>
    <button class="mdc-button mdc-button--raised" disabled>
      Disabled
    </button>
  </div>

  <!-- 图标按钮与徽标结合 (Icon Buttons & Badges) -->
  <div style="font-size: 12px; font-weight: 600; margin-top: 16px; opacity: 0.85;">图标按钮与动态徽标 (Icon Buttons &amp; Badges):</div>
  <div style="display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-top: 8px;">
    <button class="mdc-button mdc-button--outlined" style="min-width: 44px; padding: 0 10px;" title="收藏">
      <i class="material-icons">favorite_border</i>
    </button>
    <button class="mdc-button mdc-button--outlined" style="min-width: 44px; padding: 0 10px;" title="分享">
      <i class="material-icons">share</i>
    </button>
    
    <!-- 带数字角标的消息图标按钮 -->
    <div class="badge-container">
      <button class="mdc-button mdc-button--raised" style="min-width: 44px; padding: 0 10px;" title="未读消息">
        <i class="material-icons">email</i>
      </button>
      <span class="badge-number">3</span>
    </div>

    <!-- 带红点角标的通知图标按钮 -->
    <div class="badge-container">
      <button class="mdc-button mdc-button--outlined" style="min-width: 44px; padding: 0 10px;" title="系统通知">
        <i class="material-icons">notifications</i>
      </button>
      <span class="badge-dot"></span>
    </div>
  </div>

  <!-- 分段按钮组 (Segmented Buttons) -->
  <div style="font-size: 12px; font-weight: 600; margin-top: 16px; opacity: 0.85;">分段控制按钮组 (Segmented Buttons):</div>
  <div style="display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-top: 8px;">
    <div class="segmented-button-group" id="demoSegmentedGroup">
      <button class="segmented-button is-selected" onclick="toggleSegmented(this)">
        <i class="material-icons" style="font-size: 16px;">view_module</i> 全景视图
      </button>
      <button class="segmented-button" onclick="toggleSegmented(this)">
        <i class="material-icons" style="font-size: 16px;">view_compact</i> 紧凑网格
      </button>
      <button class="segmented-button" onclick="toggleSegmented(this)">
        <i class="material-icons" style="font-size: 16px;">view_list</i> 详细列表
      </button>
    </div>
  </div>

  <!-- 纯圆 FAB 矩阵 (Floating Action Buttons) -->
  <div style="font-size: 12px; font-weight: 600; margin-top: 16px; opacity: 0.85;">纯圆浮动动作按钮 (FABs):</div>
  <div style="display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-top: 8px;">
    <button class="mdc-fab" style="border-radius: 50% !important;" title="Standard FAB">
      <i class="material-icons mdc-fab__icon">add</i>
    </button>
    <button class="mdc-fab mdc-fab--mini" style="border-radius: 50% !important;" title="Mini FAB">
      <i class="material-icons mdc-fab__icon">edit</i>
    </button>
    <button class="mdc-fab mdc-fab--extended" style="border-radius: 28px !important; padding: 0 20px;" title="Extended FAB">
      <i class="material-icons mdc-fab__icon">send</i>
      <span class="mdc-fab__label">Extended FAB</span>
    </button>
  </div>
</div>
