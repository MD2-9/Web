<!--
  M2.9 Content Card: 对话框、浮动菜单与工具提示
  ═══════════════════════════════════════════════════
  📦 示例调用:
    需引入: mdc-dialog.css, mdc-snackbar.css, mdc-tooltip.css
    JS 初始化: openDemoDialog(), closeDemoDialog(), showDemoToast()
-->
<!-- 💬 模块 6: 直角对话框、浮动菜单与工具提示 (Dialogs, Menus & Tooltips) -->
<div class="demo-card" id="section-dialogs">
  <h3 style="margin-top: 0; font-size: 16px; font-weight: bold; border-bottom: 1px solid rgba(0,0,0,0.08); padding-bottom: 8px; display: flex; align-items: center;">
    <i class="material-icons" style="font-size: 20px; color: var(--mdc-theme-primary); margin-right: 8px;">aspect_ratio</i>
    6. 直角对话框、浮动菜单与工具提示 (Dialogs, Menus &amp; Tooltips)
  </h3>
  <div style="display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-top: 16px;">
    <button class="mdc-button mdc-button--raised" onclick="openDemoDialog()">
      <i class="material-icons mdc-button__icon">open_in_new</i>
      打开标准直角确认对话框
    </button>

    <button class="mdc-button mdc-button--outlined" onclick="showDemoToast()">
      <i class="material-icons mdc-button__icon">notifications</i>
      触发轻量 Snackbar 提示
    </button>

    <!-- 工具提示 (Tooltips) 悬停演示 -->
    <div class="tooltip-wrapper">
      <button class="mdc-button mdc-button--unelevated" style="background-color: var(--mdc-theme-primary-container); color: var(--mdc-theme-on-primary-container);">
        <i class="material-icons mdc-button__icon">help_outline</i>
        悬停查看 Tooltip
      </button>
      <div class="tooltip-box">
        这是一个 0px 纯直角 Material 工具提示！
      </div>
    </div>
  </div>

  <!-- 模拟直角对话框 (弹窗) -->
  <div id="demoDialogOverlay" style="position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 99999; display: none; align-items: center; justify-content: center;">
    <div class="demo-card" style="width: 400px; margin: 0; box-shadow: 0 11px 15px -7px rgba(0,0,0,.2), 0 24px 38px 3px rgba(0,0,0,.14), 0 9px 46px 8px rgba(0,0,0,.12);">
      <h3 style="margin-top: 0; display: flex; align-items: center; gap: 8px;">
        <i class="material-icons" style="color: var(--mdc-theme-primary);">info</i>
        标准 MD1 纯直角对话框
      </h3>
      <p style="font-size: 13px; opacity: 0.85; line-height: 1.6;">
        本对话框严格采用 0px 纯直角边缘，配合 Material 海拔 Elevation 24 投影。点击确认或取消关闭。
      </p>
      <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px;">
        <button class="mdc-button" onclick="closeDemoDialog()">取消</button>
        <button class="mdc-button mdc-button--raised" onclick="closeDemoDialog()">确定</button>
      </div>
    </div>
  </div>
</div>
