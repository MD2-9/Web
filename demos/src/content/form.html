<!--
  M2.9 Content Card: 表单输入、选择器、滑块与开关
  ═══════════════════════════════════════════════════
  📦 示例调用:
    需引入: mdc-textfield.css, mdc-checkbox.css, mdc-radio.css, mdc-switch.css, mdc-slider.css, mdc-select.css
-->
<!-- 📝 模块 4: 表单输入、选择器、滑块与开关 (Form Controls) -->
<div class="demo-card" id="section-form">
  <h3 style="margin-top: 0; font-size: 16px; font-weight: bold; border-bottom: 1px solid rgba(0,0,0,0.08); padding-bottom: 8px; display: flex; align-items: center; gap: 8px;">
    <i class="material-icons" style="font-size: 20px; color: var(--mdc-theme-primary); flex-shrink: 0;">tune</i>
    <span>4. 表单输入、选择器、滑块与开关 (Form Controls)</span>
  </h3>
  <div style="display: flex; gap: 24px; align-items: center; flex-wrap: wrap; margin-top: 16px;">
    
    <!-- MDC 标准填充型输入框 (带前缀图标) -->
    <div class="mdc-text-field mdc-text-field--with-leading-icon" style="width: 240px;">
      <i class="material-icons mdc-text-field__icon">edit</i>
      <input type="text" id="input-filled" class="mdc-text-field__input" value="Google Sans Flex">
      <label class="mdc-floating-label mdc-floating-label--float-above" for="input-filled">Filled 输入框</label>
      <div class="mdc-line-ripple"></div>
    </div>

    <!-- MDC 标准描边型输入框 (带前缀图标) -->
    <div class="mdc-text-field mdc-text-field--outlined mdc-text-field--with-leading-icon" style="width: 240px;">
      <i class="material-icons mdc-text-field__icon">tune</i>
      <input type="text" id="input-outlined" class="mdc-text-field__input" value="Outlined Style">
      <label class="mdc-floating-label mdc-floating-label--float-above" for="input-outlined">Outlined 框</label>
    </div>

    <!-- Material Design 0px 纯直角自定义 Select 组件 -->
    <div class="mdc-select-custom" id="demoMdcSelect">
      <div class="mdc-select-custom__surface" onclick="toggleMdcSelect(event)">
        <div style="display: flex; flex-direction: column; overflow: hidden; text-align: left;">
          <span style="font-size: 11px; color: var(--mdc-theme-primary); font-weight: 600; line-height: 1.2;">选择主题算法</span>
          <span id="mdcSelectValue" style="font-size: 14px; font-weight: 500; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; margin-top: 2px;">选项 2: Google 变量字体</span>
        </div>
        <i class="material-icons" id="mdcSelectArrow" style="font-size: 22px; color: var(--mdc-theme-primary); transition: transform 0.25s ease;">arrow_drop_down</i>
      </div>
      <div class="mdc-select-custom__menu" id="mdcSelectMenu">
        <div class="mdc-select-custom__item" onclick="selectMdcOption('选项 1: 莫奈算法色阶', this)">
          <span>选项 1: 莫奈算法色阶</span>
          <i class="material-icons item-check" style="font-size: 18px; color: var(--mdc-theme-primary); visibility: hidden;">check</i>
        </div>
        <div class="mdc-select-custom__item is-selected" onclick="selectMdcOption('选项 2: Google 变量字体', this)">
          <span>选项 2: Google 变量字体</span>
          <i class="material-icons item-check" style="font-size: 18px; color: var(--mdc-theme-primary); visibility: visible;">check</i>
        </div>
        <div class="mdc-select-custom__item" onclick="selectMdcOption('选项 3: 纯直角骨架体系', this)">
          <span>选项 3: 纯直角骨架体系</span>
          <i class="material-icons item-check" style="font-size: 18px; color: var(--mdc-theme-primary); visibility: hidden;">check</i>
        </div>
      </div>
    </div>

    <!-- 纯直角复选框 -->
    <div style="display: flex; gap: 12px; align-items: center;">
      <div class="mdc-form-field">
        <div class="mdc-checkbox">
          <input type="checkbox" class="mdc-checkbox__native-control" id="cb-demo-1" checked/>
          <div class="mdc-checkbox__background">
            <svg class="mdc-checkbox__checkmark" viewBox="0 0 24 24">
              <path class="mdc-checkbox__checkmark-path" fill="none" d="M1.73,12.91 8.1,19.28 22.79,4.59"/>
            </svg>
            <div class="mdc-checkbox__mixedmark"></div>
          </div>
        </div>
        <label for="cb-demo-1" style="font-size: 13px;">已勾选</label>
      </div>

      <div class="mdc-form-field">
        <div class="mdc-checkbox">
          <input type="checkbox" class="mdc-checkbox__native-control" id="cb-demo-2"/>
          <div class="mdc-checkbox__background">
            <svg class="mdc-checkbox__checkmark" viewBox="0 0 24 24">
              <path class="mdc-checkbox__checkmark-path" fill="none" d="M1.73,12.91 8.1,19.28 22.79,4.59"/>
            </svg>
            <div class="mdc-checkbox__mixedmark"></div>
          </div>
        </div>
        <label for="cb-demo-2" style="font-size: 13px;">未勾选</label>
      </div>
    </div>

    <!-- 纯圆单选按钮 -->
    <div style="display: flex; gap: 12px; align-items: center;">
      <div class="mdc-form-field">
        <div class="mdc-radio">
          <input class="mdc-radio__native-control" type="radio" id="radio-opt-1" name="radios-demo" checked>
          <div class="mdc-radio__background">
            <div class="mdc-radio__outer-circle"></div>
            <div class="mdc-radio__inner-circle"></div>
          </div>
        </div>
        <label for="radio-opt-1" style="font-size: 13px;">单选 A</label>
      </div>

      <div class="mdc-form-field">
        <div class="mdc-radio">
          <input class="mdc-radio__native-control" type="radio" id="radio-opt-2" name="radios-demo">
          <div class="mdc-radio__background">
            <div class="mdc-radio__outer-circle"></div>
            <div class="mdc-radio__inner-circle"></div>
          </div>
        </div>
        <label for="radio-opt-2" style="font-size: 13px;">单选 B</label>
      </div>
    </div>

    <!-- M2.9 纯正规范滑动开关 -->
    <label class="m29-switch">
      <input type="checkbox" id="switch-demo" checked>
      <span class="m29-switch-track">
        <span class="m29-switch-thumb"></span>
      </span>
      <span style="font-size: 13px; font-weight: 500;">M2.9 动态色开关</span>
    </label>

    <!-- MD1 / MDUI 纯正规范大头针数字滑块 -->
    <div class="m29-slider-container">
      <span style="font-size: 13px; font-weight: 600;">色阶滑块:</span>
      <div class="m29-slider" id="m29SliderBox">
        <input type="range" id="slider-tone" min="10" max="90" value="40">
        <div class="m29-slider-track"></div>
        <div class="m29-slider-fill" id="m29SliderFill" style="width: 37.5%;"></div>
        <div class="m29-slider-thumb-wrapper" id="m29SliderThumbWrapper" style="left: 37.5%;">
          <div class="m29-slider-thumb">
            <span id="m29SliderPinText">40</span>
          </div>
        </div>
      </div>
      <span id="slider-val" style="font-size: 12px; font-family: monospace; font-weight: bold; width: 60px;">Tone 40</span>
    </div>

  </div>
</div>
