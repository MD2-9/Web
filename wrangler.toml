#
# Cloudflare Workers Configuration for MDC-Web M2.9
# Authored by 安秋 (github.com/unjal29)
#

name = "m2-9-showroom"
main = "worker.js"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]

# Workers Static Assets Configuration
[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true

# Environment Configuration
[vars]
PROJECT_NAME = "M2.9 · MDC-Web Showroom"
DEFAULT_PAGE = "/demos/index.html"
